<!DOCTYPE html>
<html lang="id" data-theme="dark" data-mode="normal">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>ERWIN AI</title>
<style>
  /* ============================================================
     STYLE LENGKAP (SAMA KAYA SEBELUMNYA)
     ============================================================ */
  :root[data-theme="dark"]{
    --bg:#0a0a16; --bg-gradient:linear-gradient(160deg,#0a0a16,#150a26);
    --surface:#12122a; --surface-alt:#171733; --border:#26264a;
    --text:#f1f1fa; --muted:#8d8db0; --accent1:#7c6bff; --accent2:#ff2fd0; --accent-text:#ffffff;
  }
  :root[data-theme="light"]{
    --bg:#f4f3fb; --bg-gradient:linear-gradient(160deg,#f7f6fd,#eeecfb);
    --surface:#fff; --surface-alt:#f7f6fd; --border:#e2e0f4;
    --text:#17172c; --muted:#6c6c8c; --accent1:#6d5ef8; --accent2:#a06bff; --accent-text:#ffffff;
  }
  :root[data-mode="liar"]{ --accent1:#ff3b5c; --accent2:#ff8a3d; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--bg-gradient); color:var(--text);
    font-family:'DM Sans',sans-serif; min-height:100vh; width:100%;
    -webkit-font-smoothing:antialiased;
  }
  textarea::placeholder, input::placeholder{ color:var(--muted); }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:color-mix(in srgb, var(--accent1) 35%, transparent); border-radius:3px; }
  @keyframes erwin-spin{ to{ transform:rotate(360deg); } }
  .spin{ animation:erwin-spin 1s linear infinite; }
  button{ font-family:inherit; }
  a{ text-decoration:none; }

  #app{ min-height:100vh; width:100%; }

  .auth-screen{ min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ max-width:360px; width:100%; }
  .auth-header{ text-align:center; margin-bottom:28px; }
  .auth-logo-wrap{ display:flex; justify-content:center; margin-bottom:14px; }
  .auth-title{ font-family:'Outfit',sans-serif; font-weight:800; font-size:24px; color:var(--text); }
  .auth-sub{ font-size:13px; color:var(--muted); margin-top:4px; }
  .tab-switcher{ display:flex; background:var(--surface-alt); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:22px; gap:4px; }
  .tab-btn{ flex:1; padding:9px 0; border-radius:9px; border:none; font-weight:700; font-size:13px; cursor:pointer; color:var(--muted); background:transparent; transition:all .2s; }
  .tab-btn.active{ background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:var(--accent-text); }
  .field-group{ display:flex; flex-direction:column; gap:13px; }
  .field-wrap{ position:relative; }
  .field-icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; display:flex; }
  .field-input{ width:100%; background:var(--surface-alt); border:1.5px solid var(--border); border-radius:12px; padding:13px 14px 13px 42px; color:var(--text); font-size:14px; outline:none; font-family:'DM Sans',sans-serif; }
  .field-toggle{ position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; padding:0; display:flex; }
  .auth-msg{ margin-top:12px; padding:9px 12px; border-radius:9px; font-size:12.5px; }
  .auth-msg.err{ background:rgba(255,92,122,.1); border:1px solid rgba(255,92,122,.3); color:#ff5c7a; }
  .auth-submit{ width:100%; margin-top:18px; border:none; border-radius:12px; padding:14px 16px; background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:var(--accent-text); font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .auth-submit:disabled{ opacity:.7; cursor:not-allowed; }
  .auth-divider{ display:flex; align-items:center; gap:10px; margin:18px 0; }
  .auth-divider .line{ flex:1; height:1px; background:var(--border); }
  .auth-divider span{ font-size:11px; color:var(--muted); }
  .guest-btn{ width:100%; border:1.5px solid var(--border); border-radius:12px; padding:13px 16px; background:var(--surface-alt); color:var(--text); font-size:13.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .guest-btn:disabled{ opacity:.7; cursor:not-allowed; }
  .auth-hint{ text-align:center; margin-top:8px; font-size:10.5px; color:var(--muted); line-height:1.5; }
  .auth-switch{ text-align:center; margin-top:16px; font-size:11px; color:var(--muted); }
  .link-btn{ background:none; border:none; color:var(--accent1); font-weight:700; cursor:pointer; font-size:11px; }

  .loading-screen{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:linear-gradient(160deg,#0a0a16,#150a26); }
  .loading-text{ color:#8d8db0; font-size:13px; font-family:'DM Sans',sans-serif; }
  .splash-screen{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:var(--bg-gradient); animation:erwin-splash-fade .6s ease; }
  .splash-logo{ animation:erwin-splash-pop .7s cubic-bezier(.34,1.56,.64,1); }
  .splash-name{ font-family:'Outfit',sans-serif; font-weight:800; font-size:26px; letter-spacing:.5px; color:var(--text); margin-top:6px; animation:erwin-splash-fade .8s ease .1s both; }
  .splash-sub{ font-size:12.5px; color:var(--muted); animation:erwin-splash-fade .8s ease .2s both; }
  .splash-bar{ width:120px; height:3px; border-radius:3px; background:var(--border); overflow:hidden; margin-top:16px; }
  .splash-bar-fill{ height:100%; width:40%; border-radius:3px; background:linear-gradient(90deg,var(--accent1),var(--accent2)); animation:erwin-splash-load 1.1s ease-in-out infinite; }
  @keyframes erwin-splash-fade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes erwin-splash-pop{ from{ opacity:0; transform:scale(.7); } to{ opacity:1; transform:scale(1); } }
  @keyframes erwin-splash-load{ 0%{ transform:translateX(-120%); } 100%{ transform:translateX(320%); } }

  .maint-icon-wrap{ display:flex; justify-content:center; margin-bottom:16px; }
  .maint-icon-glow{ width:84px; height:84px; border-radius:24px; display:flex; align-items:center; justify-content:center; background:rgba(255,92,122,.12); border:1.5px solid rgba(255,92,122,.35); box-shadow:0 0 30px rgba(255,92,122,.25); animation:erwin-maint-pulse 2.2s ease-in-out infinite; }
  @keyframes erwin-maint-pulse{ 0%,100%{ box-shadow:0 0 22px rgba(255,92,122,.2); } 50%{ box-shadow:0 0 40px rgba(255,92,122,.4); } }
  .maint-title{ font-family:'Outfit',sans-serif; font-weight:800; font-size:23px; color:var(--text); text-align:center; }
  .maint-sub{ font-size:12.5px; color:var(--muted); text-align:center; margin-top:10px; line-height:1.7; }
  .maint-quote{ margin-top:22px; padding:14px 16px; border-radius:12px; background:var(--surface-alt); border:1px solid var(--border); font-size:12px; color:var(--text); text-align:center; line-height:1.8; }

  .main-shell{ min-height:100vh; width:100%; display:flex; position:relative; overflow:hidden; }
  .content-col{ flex:1; display:flex; flex-direction:column; min-width:0; }

  .topbar{ display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border); background:var(--surface); position:relative; z-index:20; overflow-x:auto; }
  .icon-btn{ background:var(--surface-alt); border:1px solid var(--border); border-radius:8px; padding:8px; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand{ display:flex; align-items:center; gap:7px; flex-shrink:0; }
  .brand-name{ font-family:'Outfit',sans-serif; font-weight:800; font-size:13.5px; letter-spacing:.3px; }
  .pill-btn{ display:flex; align-items:center; gap:5px; background:var(--surface-alt); border:1px solid var(--border); border-radius:999px; padding:7px 11px; font-size:11px; font-weight:700; color:var(--text); cursor:pointer; white-space:nowrap; flex-shrink:0; }
  .model-btn{ font-weight:700; }
  .model-tag{ width:16px; height:16px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:800; }
  .single-pill{ color:var(--muted); cursor:default; }
  .spacer{ flex:1; }
  .usage-badge{ display:flex; align-items:center; gap:5px; flex-shrink:0; border-radius:999px; padding:5px 10px; font-size:11px; font-weight:700; border:1px solid var(--border); background:var(--surface-alt); color:var(--muted); }
  .usage-badge.warn{ color:#f5a623; }
  .usage-badge.danger{ color:#ff5c7a; background:rgba(255,92,122,.12); border-color:rgba(255,92,122,.4); }
  .usage-badge .sep{ opacity:.5; }
  .settings-wrap{ position:relative; flex-shrink:0; }
  .dropdown{ position:absolute; top:44px; right:0; background:var(--surface-alt); border:1px solid var(--border); border-radius:10px; padding:10px; width:170px; box-shadow:0 16px 40px rgba(0,0,0,.35); z-index:49; }
  .dropdown-label{ font-size:10px; color:var(--muted); font-weight:700; letter-spacing:.6px; text-transform:uppercase; padding:2px 6px 8px; }
  .dropdown-overlay{ position:fixed; inset:0; z-index:48; }
  .appearance-opt{ display:flex; align-items:center; gap:8px; width:100%; background:transparent; border:none; border-radius:6px; padding:8px 8px; color:var(--text); font-size:12.5px; font-weight:500; cursor:pointer; }
  .appearance-opt.active{ background:color-mix(in srgb, var(--accent1) 13%, transparent); color:var(--accent1); font-weight:700; }

  .messages-scroll{ flex:1 1 auto; min-height:0; height:auto; overflow-y:auto; overflow-x:hidden; padding:20px 16px 10px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; position:relative; }
  .messages-inner{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  .msg-row{ display:flex; }
  .msg-row.user{ justify-content:flex-end; }
  .msg-row.assistant{ justify-content:flex-start; }
  .msg-col{ max-width:85%; }
  .msg-attachments{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .msg-row.user .msg-attachments{ justify-content:flex-end; }
  .attach-chip{ display:flex; align-items:center; gap:5px; background:var(--surface-alt); border:1px solid var(--border); border-radius:999px; padding:4px 10px; font-size:10.5px; color:var(--muted); }
  .bubble{ padding:12px 14px; font-size:13.5px; line-height:1.65; word-break:break-word; border-radius:16px 16px 16px 4px; border:1px solid var(--border); background:var(--surface); color:var(--text); }
  .bubble.user{ border:none; border-radius:16px 16px 4px 16px; color:var(--accent-text); background:linear-gradient(135deg,var(--accent1),var(--accent2)); box-shadow:0 8px 28px color-mix(in srgb, var(--accent1) 20%, transparent); white-space:pre-wrap; }
  .bubble p{ margin:0 0 8px; white-space:pre-wrap; }
  .bubble p:last-child{ margin-bottom:0; }
  .bubble strong{ font-weight:800; color:var(--accent1); }
  .bubble.user strong{ color:#fff; }
  .bubble code{ background:color-mix(in srgb, var(--accent1) 12%, transparent); border:1px solid var(--border); border-radius:5px; padding:1px 5px; font-family:'JetBrains Mono',monospace; font-size:12px; }
  .bubble .b-list{ margin:0 0 8px; padding-left:20px; }
  .bubble .b-list:last-child{ margin-bottom:0; }
  .bubble .b-list li{ margin-bottom:3px; }
  .bubble .b-hr{ border:none; border-top:1px dashed var(--border); margin:10px 0; }
  .msg-meta{ display:flex; align-items:center; gap:8px; margin-top:5px; }
  .msg-row.user .msg-meta{ justify-content:flex-end; }
  .msg-time{ font-size:10px; color:var(--muted); font-family:'JetBrains Mono',monospace; }
  .msg-action{ background:var(--surface-alt); border:1px solid var(--border); border-radius:6px; padding:5px; color:var(--muted); cursor:pointer; display:flex; align-items:center; }
  .msg-action.active{ color:var(--accent1); }
  .typing-row{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; }
  .error-row{ font-size:12px; color:#ff5c7a; background:rgba(255,92,122,.08); border:1px solid rgba(255,92,122,.25); border-radius:8px; padding:8px 12px; display:flex; align-items:center; gap:8px; }
  .error-row span{ flex:1; }
  .error-close{ background:none; border:none; color:#ff5c7a; cursor:pointer; padding:2px; display:flex; }

  .input-area{ padding:10px 16px calc(14px + env(safe-area-inset-bottom)); }
  .input-inner{ max-width:640px; margin:0 auto; }
  .attach-preview-row{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .attach-preview{ display:flex; align-items:center; gap:6px; background:var(--surface-alt); border:1px solid var(--border); border-radius:8px; padding:6px 8px; font-size:11px; color:var(--text); }
  .attach-preview img{ width:20px; height:20px; border-radius:4px; object-fit:cover; }
  .attach-preview .name{ max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .attach-remove{ background:none; border:none; color:var(--muted); cursor:pointer; display:flex; padding:0; }

  .neon-wrap{ position:relative; border-radius:26px; padding:3px; overflow:hidden; isolation:isolate; }
  .neon-wrap::before{
    content:"";
    position:absolute; inset:-75%;
    background:conic-gradient(from 0deg,
      transparent 0deg, var(--accent1) 18deg, #fff 34deg, var(--accent2) 50deg,
      transparent 92deg, transparent 228deg,
      var(--accent2) 268deg, #fff 284deg, var(--accent1) 300deg, transparent 340deg);
    animation:erwin-neon-spin 2.6s linear infinite;
    filter:blur(1.5px) saturate(1.2);
    z-index:0;
  }
  @keyframes erwin-neon-spin{ to{ transform:rotate(360deg); } }
  .neon-wrap::after{
    content:"";
    position:absolute; inset:0;
    border-radius:26px;
    box-shadow:
      0 0 16px 1px color-mix(in srgb, var(--accent1) 55%, transparent),
      0 0 32px 6px color-mix(in srgb, var(--accent2) 30%, transparent);
    animation:erwin-neon-pulse 2.4s ease-in-out infinite;
    pointer-events:none;
    z-index:2;
  }
  @keyframes erwin-neon-pulse{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }
  .neon-inner{ position:relative; z-index:1; background:var(--surface); display:flex; align-items:flex-end; gap:6px; padding:9px 9px 9px 15px; border-radius:23px; }
  .attach-input-wrap{ position:relative; display:flex; align-items:center; padding:8px 2px; flex-shrink:0; color:var(--muted); }
  .attach-input-wrap input[type=file]{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:0; }
  #chat-textarea{ flex:1; resize:none; background:transparent; border:none; outline:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; max-height:120px; padding:8px 0; line-height:1.5; overflow-y:auto; }
  #chat-textarea:disabled{ color:var(--muted); cursor:not-allowed; }
  .send-btn{ width:38px; height:38px; border-radius:50%; border:none; color:var(--accent-text); display:flex; align-items:center; justify-content:center; flex-shrink:0; background:linear-gradient(135deg,var(--accent1),var(--accent2)); transition:opacity .2s; }
  .send-btn:disabled{ opacity:.45; cursor:not-allowed; background:var(--surface-alt); color:var(--muted); }
  .input-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; padding-inline:2px; }
  .hint-text{ font-size:10px; color:var(--muted); opacity:.6; }
  .mode-switch{ display:flex; background:var(--surface-alt); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; }
  .mode-btn{ display:flex; align-items:center; gap:5px; padding:7px 14px; border-radius:999px; border:none; background:transparent; color:var(--muted); font-size:12px; font-weight:700; cursor:pointer; }
  .mode-btn.active{ color:#fff; }
  .mode-btn.active[data-mode-key="normal"]{ background:linear-gradient(135deg,var(--accent1),var(--accent2)); }
  .mode-btn.active[data-mode-key="liar"]{ background:linear-gradient(135deg,#ff3b5c,#ff8a3d); }
  .limit-banner{ margin-top:10px; padding:10px 14px; border-radius:10px; background:rgba(255,92,122,.08); border:1px solid rgba(255,92,122,.3); text-align:center; font-size:12px; color:#ff5c7a; line-height:1.6; }

  .sidebar{ position:fixed; top:0; left:-300px; height:100%; width:280px; max-width:84%; background:var(--surface); border-right:1px solid var(--border); z-index:50; transition:left .25s ease; display:flex; flex-direction:column; padding:16px; }
  .sidebar.open{ left:0; }
  .sidebar-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(3px); z-index:40; }
  .sidebar-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .sidebar-brand{ display:flex; align-items:center; gap:8px; }
  .sidebar-brand-name{ font-family:'Outfit',sans-serif; font-weight:800; font-size:15px; letter-spacing:.5px; }
  .user-card{ display:flex; align-items:center; gap:10px; background:var(--surface-alt); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:14px; }
  .user-card.guest{ margin-bottom:8px; }
  .user-avatar{ width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--accent1),var(--accent2)); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--accent-text); }
  .user-info{ flex:1; min-width:0; }
  .user-name{ font-size:13px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-sub{ font-size:10.5px; color:var(--muted); }
  .guest-banner{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:color-mix(in srgb, var(--accent1) 8%, transparent); border:1px solid color-mix(in srgb, var(--accent1) 27%, transparent); border-radius:10px; padding:8px 10px; margin-bottom:14px; font-size:11px; color:var(--text); }
  .new-chat-btn{ display:flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg,var(--accent1),var(--accent2)); border:none; border-radius:10px; padding:10px 14px; color:var(--accent-text); font-size:13px; font-weight:700; cursor:pointer; margin-bottom:18px; }
  .section-label{ font-size:10px; color:var(--muted); font-weight:700; letter-spacing:.6px; text-transform:uppercase; margin-bottom:8px; }
  .chat-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; min-height:0; }
  .chat-item{ display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:8px; background:transparent; border:1px solid transparent; cursor:pointer; color:var(--text); }
  .chat-item.active{ background:color-mix(in srgb, var(--accent1) 12%, transparent); border:1px solid color-mix(in srgb, var(--accent1) 33%, transparent); color:var(--accent1); }
  .chat-item-title{ flex:1; font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-item-del{ background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; display:flex; }
  .sidebar-footer{ margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  .social-link{ display:flex; align-items:center; gap:10px; width:100%; background:var(--surface-alt); border:1px solid var(--border); border-radius:8px; padding:9px 10px; color:var(--text); font-size:12px; font-weight:500; margin-bottom:6px; }
  .logout-btn{ display:flex; align-items:center; gap:10px; width:100%; background:rgba(255,92,122,.08); border:1px solid rgba(255,92,122,.25); border-radius:8px; padding:9px 10px; color:#ff5c7a; font-size:12px; font-weight:600; cursor:pointer; margin-top:6px; }
  .sidebar-bottom{ margin-top:12px; text-align:center; font-size:10px; color:var(--muted); }
  .beta-badge{ background:color-mix(in srgb, var(--accent1) 13%, transparent); color:var(--accent1); padding:3px 8px; border-radius:999px; font-weight:700; font-size:9px; }

  .modal-overlay{ position:fixed; inset:0; z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:70px 14px 14px; }
  .modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); }
  .modal-card{ position:relative; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; width:100%; max-width:420px; max-height:78vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,.4); }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:4px; }
  .modal-title{ font-family:'Outfit',sans-serif; font-weight:800; font-size:16px; }
  .modal-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .modal-search{ display:flex; align-items:center; gap:8px; background:var(--surface-alt); border:1px solid var(--border); border-radius:10px; padding:9px 12px; margin:14px 0; }
  .modal-search input{ flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:12.5px; }
  .modal-search .count{ font-size:10px; color:var(--muted); font-weight:700; }
  .model-list{ display:flex; flex-direction:column; gap:8px; }
  .model-item{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface-alt); border:1px solid var(--border); border-radius:12px; padding:12px 14px; cursor:pointer; }
  .model-item.active{ border:1.5px solid; }
  .model-item-tag{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11px; flex-shrink:0; }
  .model-item-body{ flex:1; min-width:0; }

<script>
/* ============================================================

   ============================================================ */

const GROQ_API_URL = "https://api.groq.com/openai/v1/chat/completions";

const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function hashPassword(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return h.toString(16).padStart(8, "0");
}

/* ---- storage helpers ---- */
const _memStore = {};
const _memKey = (key, shared) => (shared ? "shared:" : "priv:") + key;

async function storageGetRaw(key, shared) {
  const mk = _memKey(key, shared);
  try {
    if (typeof window !== "undefined" && window.storage) {
      const res = await window.storage.get(key, shared);
      if (res && typeof res.value === "string") { _memStore[mk] = res.value; return res.value; }
    }
  } catch { /* pakai cache memori di bawah */ }
  return _memStore[mk];
}
async function storageSetRaw(key, value, shared) {
  const mk = _memKey(key, shared);
  _memStore[mk] = value;
  try {
    if (typeof window !== "undefined" && window.storage) await window.storage.set(key, value, shared);
  } catch (e) { /* gagal simpan permanen, tetap lanjut pakai cache sesi ini */ }
  return true;
}
async function loadKey(key, shared = false, fallback = null) {
  const raw = await storageGetRaw(key, shared);
  if (raw === undefined || raw === null) return fallback;
  try { return JSON.parse(raw); } catch { return fallback; }
}
async function saveKey(key, shared = false, value) {
  return await storageSetRaw(key, JSON.stringify(value), shared);
}

/* ---- auth helpers ---- */
async function getUsers() { return await loadKey("erwin-users", false, {}); }
async function saveUsers(users) { return await saveKey("erwin-users", false, users); }
async function getSession() { return await loadKey("erwin-session", false, null); }
async function saveSession(uid, isGuest = false) { return await saveKey("erwin-session", false, { uid, isGuest }); }
async function clearSession() { return await saveKey("erwin-session", false, null); }

async function getOrCreateGuestId() {
  let gid = await loadKey("erwin-guest-id", false, null);
  if (!gid) {
    gid = "guest_" + genId();
    await saveKey("erwin-guest-id", false, gid);
  }
  return gid;
}
function makeGuestUser(gid) {
  return { uid: gid, displayName: "Tamu", isGuest: true };
}

async function registerUser(username, password) {
  const users = await getUsers();
  const uid = username.toLowerCase().trim();
  if (!uid || uid.length < 3) return { ok: false, msg: "Username minimal 3 karakter" };
  if (!/^[a-z0-9_]+$/.test(uid)) return { ok: false, msg: "Username hanya huruf, angka, dan _" };
  if (uid.startsWith("guest_")) return { ok: false, msg: "Username tidak boleh diawali 'guest_'" };
  if (uid === "admin") return { ok: false, msg: "Username tidak tersedia" };
  if (users[uid]) return { ok: false, msg: "Username sudah dipakai" };
  if (password.length < 6) return { ok: false, msg: "Password minimal 6 karakter" };
  const newUser = { uid, displayName: username.trim(), hash: hashPassword(password), createdAt: Date.now() };
  users[uid] = newUser;
  await saveUsers(users);
  return { ok: true, user: newUser };
}

const ADMIN_UID = "admin";
const ADMIN_PASSWORD = "admin2011";
async function ensureAdminAccount() {
  const users = await getUsers();
  const cur = users[ADMIN_UID];
  const wantHash = hashPassword(ADMIN_PASSWORD);
  if (!cur || !cur.isAdmin || cur.hash !== wantHash) {
    users[ADMIN_UID] = { uid: ADMIN_UID, displayName: "Admin", hash: wantHash, isAdmin: true, createdAt: cur?.createdAt || Date.now() };
    await saveUsers(users);
  }
}

async function loginUser(username, password) {
  const users = await getUsers();
  const uid = username.toLowerCase().trim();
  const user = users[uid];
  if (!user) return { ok: false, msg: "Akun tidak ditemukan" };
  if (user.hash !== hashPassword(password)) return { ok: false, msg: "Password salah" };
  return { ok: true, user };
}

/* ---- maintenance mode ---- */
async function getMaintenance() { return await loadKey("erwin-maintenance", true, false); }
async function setMaintenance(val) { return await saveKey("erwin-maintenance", true, !!val); }

/* ---- daily limit ---- */
function getTodayKey(uid) {
  const d = new Date();
  return `erwin-usage-${uid}-${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
async function getUsageToday(uid) {
  return await loadKey(getTodayKey(uid), false, 0);
}
async function incrementUsage(uid) {
  const key = getTodayKey(uid);
  const cur = await getUsageToday(uid);
  await saveKey(key, false, cur + 1);
  return cur + 1;
}
function getResetTime() {
  const now = new Date(), next = new Date(now);
  next.setHours(24, 0, 0, 0);
  const ms = next - now, h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  return h > 0 ? `${h} jam ${m} menit` : `${m} menit`;
}

/* ---- file helpers ---- */
function parseDataUrl(dataUrl) {
  const [meta, data] = dataUrl.split(",");
  const mediaType = meta.match(/data:(.*);base64/)?.[1] || "application/octet-stream";
  return { mediaType, data };
}
async function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (file.size > MAX_FILE_SIZE) { reject(new Error("Ukuran file maksimal 8MB")); return; }
    const isImage = file.type.startsWith("image/"), isPdf = file.type === "application/pdf";
    if (!isImage && !isPdf) { reject(new Error("Hanya foto atau PDF yang didukung")); return; }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Gagal membaca file"));
    reader.readAsDataURL(file);
  });
}
async function copyText(text, onDone, onFail) {
  const value = String(text ?? "");
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(value);
      onDone?.();
      return true;
    }
  } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = value;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.left = "-9999px"; ta.style.top = "0"; ta.style.opacity = "0.01";
    document.body.appendChild(ta);
    ta.focus({preventScroll:true});
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand("copy");
    ta.remove();
    if (!ok) throw new Error("copy command failed");
    onDone?.();
    return true;
  } catch (e) {
    console.error("copy failed", e);
    onFail?.();
    return false;
  }
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---- formatter ---- */
function formatAssistantText(text) {
  let raw = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");

  // Normalisasi daftar bernomor agar setiap poin punya jarak yang lega.
  raw = raw.replace(/(^|\n)\s*(\d+)[.)]\s+(.+)$/gm, "$1$2. $3");
  raw = raw.replace(/(^|\n)(\d+\.\s+[^\n]+)\n(?!\n)/g, "$1$2\n\n");

  let s = escapeHtml(raw);
  const blocks = [];

  s = s.replace(/```([\s\S]*?)```/g, (_, code) => {
    const id = `@@CODE${blocks.length}@@`;
    blocks.push(`<pre><code>${code.trim()}</code></pre>`);
    return id;
  });

  s = s.replace(/^###\s+(.+)$/gm, "<h3>$1</h3>");
  s = s.replace(/^##\s+(.+)$/gm, "<h2>$1</h2>");
  s = s.replace(/^#\s+(.+)$/gm, "<h1>$1</h1>");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_]+?)__/g, "<strong>$1</strong>");
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/^>\s?(.*)$/gm, "<blockquote>$1</blockquote>");
  s = s.replace(/^(?:[-*])\s+(.+)$/gm, "<li>$1</li>");
  s = s.replace(/(?:<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);

  // Nomor + judul dibuat sebagai blok khusus.
  s = s.replace(
    /(^|\n)(\d+\.\s+)(.+?)(?=\n\n|\n\d+\.\s+|$)/gs,
    (_, prefix, number, content) => {
      const lines = content.split("\n").map(x => x.trim()).filter(Boolean);
      const title = `${number}${lines.shift() || ""}`;
      const body = lines.length
        ? `<div class="num-item-body">${lines.join("<br>")}</div>`
        : "";
      return `${prefix}<div class="num-item"><div class="num-item-title">${title}</div>${body}</div>`;
    }
  );

  s = s.split(/\n{2,}/).map(part => {
    const t = part.trim();
    if (!t) return "";
    if (/^<(h[1-3]|ul|ol|blockquote|pre|table|hr|div class="num-item")/.test(t)) return t;
    return `<p>${t.replace(/\n/g, "<br>")}</p>`;
  }).join("");

  blocks.forEach((block, i) => {
    s = s.replace(`@@CODE${i}@@`, block);
  });

  return s;
}
function inlineFormat(line) {
  let s = escapeHtml(line);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}

async function callGroq(historyMsgs, systemPrompt, attachments, onChunk = null) {
  if (!GROQ_API_KEY) throw new Error("API key Groq belum diisi. Masukkan key melalui backend/environment variable.");

  const selected = activeModel();
  const model = selected.apiModel || "qwen/qwen3.6-27b";
  const imageAttachments = (attachments || []).filter(a => a.kind === "image");

  const messages = [{
    role: "system",
    content: `${systemPrompt}\n\nATURAN PENTING: Jangan pernah menampilkan <think>, </think>, reasoning, chain-of-thought, catatan analisis internal, atau proses berpikir tersembunyi. Hanya kirim jawaban akhir yang ditujukan untuk pengguna.`
  }, ...historyMsgs.map(m => ({ role: m.role, content: m.content || " " }))];

  // Groq vision menerima content multimodal: text + image_url(data URL).
  // Gambar hanya ditempel ke pesan user terbaru agar konteks tetap hemat.
  if (imageAttachments.length) {
    const lastUser = [...messages].reverse().find(m => m.role === "user");
    if (lastUser) {
      const textPart = typeof lastUser.content === "string" ? lastUser.content : "Tolong analisis gambar yang saya kirim.";
      lastUser.content = [
        { type: "text", text: textPart },
        ...imageAttachments.slice(0, 5).map(a => ({
          type: "image_url",
          image_url: { url: `data:${a.mediaType};base64,${a.data}` }
        }))
      ];
    }
  }

  const filteredMessages = messages.filter(m => {
    if (Array.isArray(m.content)) return m.content.length > 0;
    return m.content && m.content.trim().length > 0;
  });
  if (!filteredMessages.length) throw new Error("Tidak ada pesan untuk dikirim");

  const body = {
    model,
    messages: filteredMessages,
    max_tokens: 1200,
    temperature: 0.55,
    top_p: 0.9,
    stream: !!onChunk
  };
  if (model === "qwen/qwen3.6-27b") body.reasoning_effort = "none";

  const controller = new AbortController();
  S.streamController = controller;
  const response = await fetch(GROQ_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${GROQ_API_KEY}` },
    body: JSON.stringify(body),
    signal: controller.signal
  });

  if (!response.ok) {
    let errData = {};
    try { errData = await response.json(); } catch {}
    throw new Error(`Error dari Groq API: ${errData?.error?.message || `HTTP ${response.status}`}`);
  }

  if (!onChunk) {
    const data = await response.json();
    let content = data?.choices?.[0]?.message?.content || "";
    content = content.replace(/<think>[\s\S]*?<\/think>/gi, "").replace(/<thinking>[\s\S]*?<\/thinking>/gi, "").replace(/<analysis>[\s\S]*?<\/analysis>/gi, "").trim();
    if (!content) throw new Error("Tidak ada respons akhir dari Groq API");
    return content;
  }

  if (!response.body) throw new Error("Browser tidak mendukung streaming respons.");
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "", content = "";

  while (true) {
    // Jeda hanya menghentikan tampilan token sementara; koneksi tetap aman dan bisa dilanjutkan.
    if (S.streamPaused) {
      await new Promise(resolve => { S.resumeStream = resolve; });
      S.resumeStream = null;
    }

    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const events = buffer.split("\n");
    buffer = events.pop() || "";

    for (const line of events) {
      if (!line.startsWith("data:")) continue;
      const payload = line.slice(5).trim();
      if (!payload || payload === "[DONE]") continue;
      try {
        const delta = JSON.parse(payload)?.choices?.[0]?.delta?.content || "";
        if (delta) {
          content += delta;
          content = content.replace(/<think>[\s\S]*?<\/think>/gi, "").replace(/<thinking>[\s\S]*?<\/thinking>/gi, "").replace(/<analysis>[\s\S]*?<\/analysis>/gi, "");
          onChunk(content);
        }
      } catch {}
    }
  }
  return content.trim();
}

    year: "numeric"
  });

  clockEl.textContent = d.toLocaleTimeString("id-ID", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });
}

function normalizeHex(hex, fallback = "#7c6bff") {
  const v = String(hex || "").trim();
  return /^#[0-9a-fA-F]{6}$/.test(v) ? v.toLowerCase() : fallback;
}
function hexToRgb(hex) {
  const v = normalizeHex(hex).slice(1);
  return { r: parseInt(v.slice(0,2),16), g: parseInt(v.slice(2,4),16), b: parseInt(v.slice(4,6),16) };
}
function rgbToHex(r,g,b) {
  return "#" + [r,g,b].map(n => Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,"0")).join("");
}
function shiftColor(hex, amount = 34) {
  const {r,g,b} = hexToRgb(hex);
  const luminance = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
  const delta = luminance > 0.62 ? -Math.abs(amount) : Math.abs(amount);
  return rgbToHex(r + delta, g + delta, b + delta);
}
function applyThemeVars() {
  const root = document.documentElement;
  S.accentColor = normalizeHex(S.accentColor);
  root.setAttribute("data-theme", S.themeName);
  root.setAttribute("data-mode", S.mode === "liar" ? "liar" : "normal");
  root.style.setProperty("--accent1", S.accentColor);
  root.style.setProperty("--accent2", shiftColor(S.accentColor, 34));
  const {r,g,b} = hexToRgb(S.accentColor);
  const yiq = (r * 299 + g * 587 + b * 114) / 1000;
  root.style.setProperty("--accent-text", yiq > 170 ? "#111111" : "#ffffff");
}

let renderFramePending = false;
function scheduleRender() {
  if (renderFramePending) return;
  renderFramePending = true;
  requestAnimationFrame(() => {
    renderFramePending = false;
    render();
  });
}

function render() {
  applyThemeVars();

  // Simpan posisi scroll chat sebelum DOM dirender ulang supaya
  // saat user membaca pesan lama, posisinya tidak dilempar ke bawah.
  const oldScroll = document.getElementById("messages-scroll");
  if (oldScroll) {
    const distanceFromBottom = oldScroll.scrollHeight - oldScroll.scrollTop - oldScroll.clientHeight;
    S.chatScrollTop = oldScroll.scrollTop;
    S.chatWasNearBottom = distanceFromBottom < 120;
  }

  const app = document.getElementById("app");
  if (S.showSplash) { app.innerHTML = renderSplash(); hydrateIcons(); return; }
  if (!S.ready) { app.innerHTML = renderLoading(); hydrateIcons(); return; }
  if (!S.currentUser) { app.innerHTML = renderAuth(); afterAuthRender(); return; }
  if (isMaintBlocked()) { app.innerHTML = renderMaintenance(); hydrateIcons(); return; }
  if (S.colorMenuOpen) { app.innerHTML = renderColorScreen(); hydrateIcons(); return; }
  app.innerHTML = renderMain();
  afterMainRender();
}

async function authSubmit() {
  const username = document.getElementById("auth-username")?.value || "";
  const password = document.getElementById("auth-password")?.value || "";
  const confirm = document.getElementById("auth-confirm")?.value || "";
  S.authError = "";
  if (!username.trim() || !password) { S.authError = "Isi semua field"; render(); return; }
  S.authLoading = true; render();
  try {
    if (S.authTab === "register") {
      if (password !== confirm) { S.authError = "Password tidak cocok"; return; }
      const res = await registerUser(username, password);
      if (!res.ok) { S.authError = res.msg; return; }
      await saveSession(res.user.uid, false);
      await handleAuth(res.user);
    } else {
      const res = await loginUser(username, password);
      if (!res.ok) { S.authError = res.msg; return; }
      await saveSession(res.user.uid, false);
      await handleAuth(res.user);
    }
  } finally {
    S.authLoading = false;
    render();
  }
}

async function authGuest() {
  S.authError = ""; S.authGuestLoading = true; render();
  try {
    const gid = await getOrCreateGuestId();
    await saveSession(gid, true);
    await handleGuest(makeGuestUser(gid));
  } finally {
    S.authGuestLoading = false;
    render();
  }
}

function afterMainRender() {
  hydrateIcons();
  startHeaderDateTime();
  setupMessageScroll();

  const scrollEl = document.getElementById("messages-scroll");
  if (scrollEl) {
    if (S.chatScrollTop !== null && !S.chatWasNearBottom) {
      scrollEl.scrollTop = S.chatScrollTop;
    } else {
      scrollEl.scrollTop = scrollEl.scrollHeight;
    }
    updateScrollBottomButton();
  }

  positionScrollBottomButton();
  updateSendButton();
  const ta = document.getElementById("chat-textarea");
  if (ta) { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px"; }
  if (S.modelPickerOpen) {
    const si = document.getElementById("model-search-input");
    if (si) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
  }
}

function positionScrollBottomButton() {
  const btn = document.getElementById("scroll-bottom-btn");
  const inputArea = document.querySelector(".input-area");
  const bottomNav = document.querySelector(".bottom-nav");
  if (!btn) return;

  const inputH = inputArea ? inputArea.getBoundingClientRect().height : 88;
  const navH = bottomNav ? bottomNav.getBoundingClientRect().height : 67;
  const gap = 10;
  btn.style.bottom = `${Math.max(10, inputH + navH + gap)}px`;
}

function updateScrollBottomButton() {
  const scrollEl = document.getElementById("messages-scroll");
  const btn = document.getElementById("scroll-bottom-btn");
  if (!scrollEl || !btn) return;
  positionScrollBottomButton();
  const distanceFromBottom = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight;
  btn.classList.toggle("show", distanceFromBottom > 150);
}

function scrollToBottom(smooth = true) {
  const scrollEl = document.getElementById("messages-scroll");
  if (!scrollEl) return;
  S.chatWasNearBottom = true;
  S.chatScrollTop = scrollEl.scrollHeight;
  scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior: smooth ? "smooth" : "auto" });
  setTimeout(updateScrollBottomButton, smooth ? 250 : 0);
}

let scrollButtonResizeBound = false;

function setupScrollButtonPositionListener() {
  if (scrollButtonResizeBound) return;
  scrollButtonResizeBound = true;
  window.addEventListener("resize", positionScrollBottomButton, { passive: true });
  window.addEventListener("orientationchange", () => setTimeout(positionScrollBottomButton, 80), { passive: true });
}

function setupMessageScroll() {
  setupScrollButtonPositionListener();
  const scrollEl = document.getElementById("messages-scroll");
  if (!scrollEl || scrollEl.dataset.listener === "true") return;
  scrollEl.dataset.listener = "true";
  scrollEl.addEventListener("scroll", () => {
    const distanceFromBottom = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight;
    S.chatScrollTop = scrollEl.scrollTop;
    S.chatWasNearBottom = distanceFromBottom < 120;
    updateScrollBottomButton();
  }, { passive: true });
}

function updateSendButton() {
  const btn = document.getElementById("send-btn");
  const ta = document.getElementById("chat-textarea");
  if (!btn || !ta) return;
  const hasContent = ta.value.trim().length > 0 || S.attachments.length > 0;
  btn.disabled = !hasContent || S.sending || limitReached();
}

async function handleAuth(user) {

async function loadUserData(user) {
  const [savedChats, usage, maint] = await Promise.all([
    loadKey(`erwin-chats-${user.uid}`, false, null),
    getUsageToday(user.uid),
    getMaintenance(),
  ]);
  S.usageToday = usage;
  S.maintenance = !!maint;
  const finalChats = savedChats && savedChats.length ? savedChats : [newChat(user.displayName)];
  S.chats = finalChats;
  S.activeId = finalChats[0].id;
}
async function persistChats() {
  if (S.currentUser && S.chats.length) await saveKey(`erwin-chats-${S.currentUser.uid}`, false, S.chats);
}

async function handleLogout() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  await clearSession();
  S.currentUser = null; S.chats = []; S.activeId = null; S.speakingId = null;
  S.attachments = []; S.error = null; S.sidebarOpen = false;
  render();
}

function handleNewChat() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  S.speakingId = null;
  const c = newChat(S.currentUser?.displayName);
  S.chats = [c, ...S.chats];
  S.activeId = c.id;
  S.sidebarOpen = false;
  S.attachments = [];
  S.error = null;
  persistChats();
  render();
}

function handleDeleteChat(id) {
  let next = S.chats.filter(c => c.id !== id);
  if (!next.length) {
    const c = newChat(S.currentUser?.displayName);
    next = [c];
    S.activeId = c.id;
  } else if (id === S.activeId) {
    S.activeId = next[0].id;
  }
  S.chats = next;
  persistChats();
  render();
}

async function handleFiles(fileList) {
  S.error = null;
  for (const f of Array.from(fileList || [])) {
    try {
      const dataUrl = await fileToDataUrl(f);
      const { mediaType, data } = parseDataUrl(dataUrl);
      const kind = f.type.startsWith("image/") ? "image" : "pdf";
      S.attachments = [...S.attachments, { id: genId(), name: f.name, kind, mediaType, data, preview: kind==="image"?dataUrl:null }];
    } catch (err) { S.error = err.message; }
  }
  render();
}

function removeAttachment(id) {
  S.attachments = S.attachments.filter(a => a.id !== id);
  render();
}

async function toggleMaintenance() {
  S.maintenance = !S.maintenance;
  await setMaintenance(S.maintenance);
  render();
}

async function send() {
  if (isMaintBlocked()) return;
  const ta = document.getElementById("chat-textarea");
  const text = (ta?.value || "").trim();
  const chat = activeChat();
  if ((!text && !S.attachments.length) || S.sending || !chat) return;
  if (S.usageToday >= dailyLimit()) { S.error = `Batas harian tercapai (${dailyLimit()}/hari). Reset dalam ${getResetTime()}.`; render(); return; }

  S.error = null;
  const curAttach = [...S.attachments];
  const attachNames = curAttach.map(a => a.name);
  const userMsg = { id: genId(), role: "user", content: text, attachNames, ts: Date.now() };
  const isFirst = !chat.messages.some(m => m.role === "user");
  const chatId = chat.id;
  const snap = [...chat.messages, userMsg];

  S.chats = S.chats.map(c => c.id === chatId ? { ...c, title: isFirst ? (text || attachNames[0] || "Chat baru").slice(0,32) : c.title, messages: snap } : c);
  S.attachments = [];
  S.sending = true;
  S.streamPaused = false;
  persistChats();
  render();

  const aiMsg = { id: genId(), role: "assistant", content: "", ts: Date.now() };
  S.chats = S.chats.map(c => c.id === chatId ? { ...c, messages: [...c.messages, aiMsg] } : c);
  render();

  try {
    const hist = snap.filter(m => m.role === "user" || m.role === "assistant").map(m => ({
      role: m.role,
      content: m.attachNames?.length ? `${m.content}${m.content ? "\n" : ""}[Lampiran: ${m.attachNames.join(", ")}]` : (m.content || " ")
    }));

    const reply = await callGroq(hist, MODES[S.mode].system + ERWIN_RESPONSE_STYLE, curAttach, (partial) => {
      S.chats = S.chats.map(c => c.id === chatId ? { ...c, messages: c.messages.map(m => m.id === aiMsg.id ? { ...m, content: partial } : m) } : c);
      scheduleRender();
    });

    S.chats = S.chats.map(c => c.id === chatId ? { ...c, messages: c.messages.map(m => m.id === aiMsg.id ? { ...m, content: reply || "Maaf, respons kosong. Coba lagi ya 😅" } : m) } : c);
    const newCount = await incrementUsage(S.currentUser?.uid || "guest");
    S.usageToday = newCount;
  } catch (e) {
    if (e?.name === "AbortError") {
      S.error = "Pengiriman dihentikan.";
      S.chats = S.chats.map(c => c.id === chatId ? { ...c, messages: c.messages.filter(m => m.id !== aiMsg.id) } : c);
    } else {
      S.error = `Gagal: ${e.message || "Coba lagi."}`;
      S.chats = S.chats.map(c => c.id === chatId ? { ...c, messages: c.messages.filter(m => m.id !== aiMsg.id) } : c);
    }
  } finally {
    S.streamController = null;
    S.sending = false;
    S.streamPaused = false;
    S.resumeStream = null;
    persistChats();
    render();
  }
}

function toggleStreamPause() {
  if (!S.sending) return;
  if (S.streamPaused) {
    S.streamPaused = false;
    if (S.resumeStream) S.resumeStream();
  } else {
    S.streamPaused = true;
  }
  render();
}
async function regenerate() {
  if (isMaintBlocked()) return;
  const chat = activeChat();
  if (!chat || S.sending) return;
  const msgs = chat.messages;
  const lastUserIdxFromEnd = [...msgs].reverse().findIndex(m => m.role === "user");
  if (lastUserIdxFromEnd === -1) return;
  const idx = msgs.length - 1 - lastUserIdxFromEnd;
  const trimmed = msgs.slice(0, idx + 1);
  const chatId = chat.id;
  S.chats = S.chats.map(c => c.id === chatId ? { ...c, messages: trimmed } : c);
  S.sending = true; S.error = null;
  render();
  try {
    const hist = trimmed.filter(m => m.role==="user" || m.role==="assistant").map(m => ({
      role: m.role, content: m.attachNames?.length ? `${m.content}\n[Lampiran: ${m.attachNames.join(", ")}]` : (m.content || " "),
    }));
    
    const reply = await callGroq(hist, MODES[S.mode].system + ERWIN_RESPONSE_STYLE, []);
    
    const aiMsg = { id: genId(), role: "assistant", content: reply, ts: Date.now() };
    S.chats = S.chats.map(c => c.id === chatId ? { ...c, messages: [...c.messages, aiMsg] } : c);
  } catch (e) {
    S.error = `Gagal: ${e.message || "Coba lagi."}`;
  } finally {
    S.sending = false;
    persistChats();
    render();
  }
}

function speak(id, text) {
  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
    S.error = "Fitur dengarkan tidak didukung di browser/perangkat ini.";
    render();
    return;
  }
  const synth = window.speechSynthesis;
  if (S.speakingId === id) {
    synth.cancel();
    S.speakingId = null;
    utterance = null;
    render();
    return;
  }

  synth.cancel();
  try {
    const cleanText = String(text || "").replace(/```[\s\S]*?```/g, " kode ").replace(/[*_`#]/g, "");
    const u = new SpeechSynthesisUtterance(cleanText);
    u.lang = "id-ID";
    u.rate = 0.98;
    u.pitch = 1;
    const voices = synth.getVoices ? synth.getVoices() : [];
    const idVoice = voices.find(v => /^id(-|_)/i.test(v.lang));
    if (idVoice) u.voice = idVoice;
    u.onstart = () => { S.speakingId = id; render(); };
    u.onend = () => { if (S.speakingId === id) S.speakingId = null; utterance = null; render(); };
    u.onerror = (e) => { if (e.error !== "canceled") S.error = "Gagal memutar suara. Coba lagi."; S.speakingId = null; utterance = null; render(); };
    utterance = u;
    S.speakingId = id;
    // Speak langsung dari event click agar Android WebView/browser tidak kehilangan user gesture.
    synth.resume();
    synth.speak(u);
    render();
  } catch (e) {
    S.speakingId = null;
    S.error = "Gagal memutar suara: " + (e.message || "tidak diketahui");
    render();
  }
}

   ============================================================ */
async function init() {
  render();
  const splashDelay = new Promise(res => setTimeout(res, 1600 + Math.random() * 1400));

  await ensureAdminAccount();
  const [savedTheme, savedMode, savedModel, savedAccent, session] = await Promise.all([
    loadKey("erwin-theme", false, "dark"),
    loadKey("erwin-mode", false, "normal"),
    loadKey("erwin-model", false, MODELS[3].id),
    loadKey("erwin-accent", false, "#7c6bff"),
    getSession(),
  ]);
  S.themeName = savedTheme || "dark";
  S.mode = savedMode || "normal";
  S.accentColor = normalizeHex(savedAccent, "#7c6bff");
  S.selectedModel = savedModel || MODELS[3].id;

  if (session?.uid) {
    if (session.isGuest) {
      const guestUser = makeGuestUser(session.uid);
      S.currentUser = guestUser;
      await loadUserData(guestUser);
    } else {
      const users = await getUsers();
      const user = users[session.uid];
      if (user) { S.currentUser = user; await loadUserData(user); }
    }
  } else {
    S.maintenance = !!(await getMaintenance());
  }

  await splashDelay;
  S.showSplash = false;
  S.ready = true;
  render();
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");
  switch (action) {
    case "auth-tab": S.authTab = el.getAttribute("data-tab"); S.authError = ""; render(); break;
    case "auth-toggle-pw": S.authShowPw = !S.authShowPw; render(); break;
    case "auth-submit": authSubmit(); break;
    case "auth-guest": authGuest(); break;

    case "open-sidebar": S.sidebarOpen = true; render(); break;
    case "close-sidebar": S.sidebarOpen = false; render(); break;
    case "nav-chat": S.sidebarOpen = false; render(); break;
    case "nav-history": S.sidebarOpen = true; render(); break;
    case "nav-color": S.sidebarOpen = false; S.appearanceOpen = false; S.colorMenuOpen = true; render(); break;
    case "scroll-to-bottom": scrollToBottom(true); break;
    case "nav-voice": {
      S.sidebarOpen = false;
      const vc = activeChat();
      const vm = [...(vc?.messages || [])].reverse().find(m => m.role === "assistant" && m.content);
      if (vm) speak(vm.id, vm.content);
      render();
      break;
    }
    case "open-color-menu": S.appearanceOpen = false; S.colorMenuOpen = true; render(); break;
    case "close-color-menu": S.colorMenuOpen = false; render(); break;
    case "toggle-appearance": S.appearanceOpen = !S.appearanceOpen; render(); break;
    case "close-appearance": S.appearanceOpen = false; render(); break;
    case "set-theme": S.themeName = el.getAttribute("data-theme"); saveKey("erwin-theme", false, S.themeName); render(); break;
    case "set-theme-from-color": S.themeName = el.getAttribute("data-theme"); saveKey("erwin-theme", false, S.themeName); render(); break;
    case "set-accent": { S.accentColor = normalizeHex(el.getAttribute("data-color")); saveKey("erwin-accent", false, S.accentColor); render(); break; }
    case "set-accent-from-color": { S.accentColor = normalizeHex(el.getAttribute("data-color")); saveKey("erwin-accent", false, S.accentColor); S.colorMenuOpen = false; S.appearanceOpen = false; render(); break; }
    case "reset-accent": { S.accentColor = "#7c6bff"; saveKey("erwin-accent", false, S.accentColor); render(); break; }
    case "reset-accent-from-color": { S.accentColor = "#7c6bff"; saveKey("erwin-accent", false, S.accentColor); S.colorMenuOpen = false; S.appearanceOpen = false; render(); break; }
    case "set-mode": S.mode = el.getAttribute("data-mode"); saveKey("erwin-mode", false, S.mode); render(); break;

    case "open-model-picker": S.modelPickerOpen = true; S.modelSearch = ""; render(); break;
    case "close-model-picker": S.modelPickerOpen = false; render(); break;
    case "select-model": S.selectedModel = el.getAttribute("data-id"); S.modelPickerOpen = false; saveKey("erwin-model", false, S.selectedModel); render(); break;

    case "new-chat": handleNewChat(); break;
    case "select-chat": S.activeId = el.getAttribute("data-id"); S.sidebarOpen = false; S.error = null; render(); break;
    case "delete-chat": e.stopPropagation(); handleDeleteChat(el.getAttribute("data-id")); break;
    case "logout": handleLogout(); break;

    case "remove-attachment": removeAttachment(el.getAttribute("data-id")); break;
    case "dismiss-error": S.error = null; render(); break;
    case "send": send(); break;
    case "pause-send": toggleStreamPause(); break;
    case "regenerate": regenerate(); break;
    case "toggle-maintenance": toggleMaintenance(); break;
    case "copy-msg": {
      const chat = activeChat();
      const msg = chat?.messages.find(m => m.id === el.getAttribute("data-id"));
      if (msg) {
        copyText(msg.content, () => {
          el.innerHTML = '<i data-lucide="check" style="width:11px;height:11px;color:#2ecf8e;"></i>';
          hydrateIcons(el);
          setTimeout(() => { el.innerHTML = '<i data-lucide="copy" style="width:11px;height:11px;"></i>'; hydrateIcons(el); }, 1200);
        });
      }
      break;
    }
    case "speak-msg": {
      const chat = activeChat();
      const msg = chat?.messages.find(m => m.id === el.getAttribute("data-id"));
      if (msg) speak(msg.id, msg.content);
      break;
    }
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "chat-textarea") {
    e.target.style.height = "auto";
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
    updateSendButton();
  }
  if (e.target.id === "model-search-input") {
    S.modelSearch = e.target.value;
    render();
  }
  if (e.target.id === "custom-color-input" && /^#[0-9a-fA-F]{6}$/.test(e.target.value)) {
    S.accentColor = e.target.value.toLowerCase();
    saveKey("erwin-accent", false, S.accentColor);
    render();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.target.id === "chat-textarea" && e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

document.addEventListener("change", (e) => {
  if (e.target.id === "custom-color-screen" && /^#[0-9a-fA-F]{6}$/.test(e.target.value)) {
    S.accentColor = e.target.value.toLowerCase();
    saveKey("erwin-accent", false, S.accentColor);
    S.colorMenuOpen = false;
    S.appearanceOpen = false;
    render();
    return;
  }
  if (e.target.id === "file-input") {
    handleFiles(e.target.files);
    e.target.value = "";
  }
});

document.addEventListener("paste", (e) => {
  const wrap = e.target.closest && e.target.closest("#drop-zone");
  if (!wrap) return;
  const files = Array.from(e.clipboardData?.files || []);
  if (files.length) { e.preventDefault(); handleFiles(files); }
});

document.addEventListener("dragover", (e) => {
  if (e.target.closest && e.target.closest("#drop-zone")) e.preventDefault();
});
document.addEventListener("drop", (e) => {
  const wrap = e.target.closest && e.target.closest("#drop-zone");
  if (!wrap) return;
  e.preventDefault();
  handleFiles(e.dataTransfer.files);
});

window.addEventListener("beforeunload", () => { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); });

init();
</script>
</body>
</html>
