<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQC GENERATOR - @aboutwinz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #22c55e; /* Hijau Terang Menyala */
            --glow-green: #4ade80;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- LOGIN & LOADING SCREEN --- */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: #0d1117;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .login-box {
            width: 100%;
            max-width: 350px;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        .login-box h2 {
            color: white;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .login-box p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            font-size: 16px;
        }

        .login-box input:focus {
            border-color: var(--primary-green);
        }

        /* --- WELCOME ANIMATION --- */
        #welcomeContainer {
            display: none;
            text-align: center;
        }

        .typing-text {
            color: white;
            font-size: 20px;
            font-weight: 600;
            min-height: 30px;
            margin-top: 20px;
        }

        .name-highlight {
            color: var(--primary-green);
            text-transform: capitalize;
        }

        /* --- MAIN APP CONTENT --- */
        .main-content {
            opacity: 0;
            width: 100%;
            max-width: 100%;
            transition: opacity 1s ease;
        }

        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary-green);
            filter: blur(150px);
            opacity: 0.2;
            border-radius: 50%;
            top: -100px;
            left: -100px;
            z-index: 1;
        }

        .card {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            padding: 40px 20px;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 30px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 30px;
            color: white;
            letter-spacing: 1px;
        }

        .guide-box {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .example-tag {
            background: linear-gradient(135deg, var(--primary-green), var(--glow-green));
            color: white;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            font-size: 14px;
        }

        /* --- FORM ELEMENTS --- */
        .input-group { margin-bottom: 25px; }
        .input-group label {
            display: block;
            color: #dce6f2;
            font-size: 14px;
            margin-bottom: 10px;
            margin-left: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary-green), var(--glow-green));
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
            transition: 0.3s;
        }

        .btn-primary:active { transform: scale(0.97); }

        /* --- RESULT SECTION --- */
        #resultArea {
            display: none;
            margin-top: 30px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        #resultArea img {
            width: 100%;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            margin-bottom: 15px;
        }

        .btn-download {
            background: white !important;
            color: black !important;
            margin-bottom: 50px;
        }

        /* --- TELEGRAM FLOAT --- */
        .tg-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #24A1DE;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 1000;
            transition: 0.3s;
        }

        .tg-float svg { width: 32px; fill: white; }

        /* --- ANIMATIONS --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .spinner {
            width: 45px; height: 45px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid var(--primary-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box" id="loginForm">
            <h2>IQC GENERATOR</h2>
            <p>Silakan masukkan nama untuk memulai</p>
            <input type="text" id="userNameInput" placeholder="Nama kamu..." autocomplete="off">
            <button class="btn-primary" onclick="handleLogin()">Masuk Sekarang</button>
        </div>

        <div id="welcomeContainer">
            <div class="spinner"></div>
            <div class="typing-text" id="welcomeMsg"></div>
        </div>
    </div>

    <div class="main-content" id="mainApp">
        <div class="bg-glow"></div>
        
        <div class="card">
            <div class="title">IQC GENERATOR</div>

            <div class="guide-box">
                <div class="example-tag">06:00|70|Indosat|Halo Dunia</div>
                <p style="color: #8b949e; font-size: 12px; text-align: center;">
                    Format: Jam | Batre | Operator | Pesan
                </p>
            </div>

            <div class="input-group">
                <label>Masukkan Format IQC</label>
                <input type="text" id="iqcInput" placeholder="Contoh: 12:00|100|Telkomsel|P">
            </div>

            <button class="btn-primary" id="genBtn" onclick="processIQC()">Kirim Data</button>

            <div id="loadingGen" style="display:none; margin-top:20px; text-align:center; color:white;">
                <div class="spinner" style="width:30px; height:30px; border-width:3px;"></div>
                <p style="margin-top:10px; font-size:14px;">Lagi dibikin...</p>
            </div>

            <div id="resultArea">
                <img id="outputImg" src="" alt="Hasil IQC">
                <button class="btn-primary btn-download" onclick="downloadImage()">Download Ke Galeri</button>
            </div>

            <div style="margin-top: auto; text-align: center; color: #444; font-size: 11px; padding: 20px;">
                POWERED BY MASERWIN
            </div>
        </div>
    </div>

    <a href="https://t.me/aboutwinz" target="_blank" class="tg-float">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.11.02-1.93 1.23-5.46 3.62-.51.35-.98.52-1.4.51-.46-.01-1.35-.26-2.01-.48-.81-.27-1.45-.42-1.39-.89.03-.25.38-.51 1.07-.78 4.2-1.82 7-3.03 8.4-3.61 4-.17 4.83.13 4.83.13z"/></svg>
    </a>

    <script>
        // --- LOGIKA LOGIN & SAMBUTAN ---
        function handleLogin() {
            const name = document.getElementById('userNameInput').value.trim();
            if (!name) return alert("Namanya diisi dulu bosku!");

            // Sembunyikan form, tampilkan animasi loading
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('welcomeContainer').style.display = 'block';

            const welcomeMsg = document.getElementById('welcomeMsg');
            
            // Urutan pesan teks berjalan
            const steps = [
                `Halo <span class="name-highlight">${name}</span>, selamat datang!`,
                "Di Web IQC Generator...",
                "Sabar ya, lagi nyiapin menu..."
            ];

            let stepIdx = 0;

            function nextStep() {
                if (stepIdx < steps.length) {
                    welcomeMsg.innerHTML = steps[stepIdx];
                    welcomeMsg.style.animation = 'none';
                    welcomeMsg.offsetHeight; 
                    welcomeMsg.style.animation = 'fadeIn 0.5s forwards';
                    
                    stepIdx++;
                    setTimeout(nextStep, 2000); // Ganti teks tiap 2 detik
                } else {
                    // Masuk ke aplikasi utama
                    document.getElementById('loginOverlay').style.transform = 'translateY(-100%)';
                    document.getElementById('mainApp').style.opacity = '1';
                }
            }
            nextStep();
        }

        // --- LOGIKA GENERATOR IQC ---
        let currentImgFullUrl = "";

        async function processIQC() {
            const val = document.getElementById('iqcInput').value.trim();
            if (!val) return alert("Formatnya diisi dulu!");

            const p = val.split("|");
            if (p.length < 4) return alert("Format salah! Pakai pemisah | ya.");

            const btn = document.getElementById('genBtn');
            const load = document.getElementById('loadingGen');
            const res = document.getElementById('resultArea');
            const out = document.getElementById('outputImg');

            // UI Feedback
            btn.style.display = 'none';
            load.style.display = 'block';
            res.style.display = 'none';

            // API URL (Menyatukan pesan jika ada lebih dari 4 bagian)
            const jam = p[0], batre = p[1], ops = p[2], msg = p.slice(3).join("|");
            const finalUrl = `https://brat.siputzx.my.id/iphone-quoted?time=${encodeURIComponent(jam)}&batteryPercentage=${batre}&carrierName=${encodeURIComponent(ops)}&messageText=${encodeURIComponent(msg)}&emojiStyle=apple`;

            out.src = finalUrl;
            currentImgFullUrl = finalUrl;

            out.onload = () => {
                btn.style.display = 'block';
                load.style.display = 'none';
                res.style.display = 'block';
            };

            out.onerror = () => {
                alert("Gagal load gambar. Coba lagi!");
                btn.style.display = 'block';
                load.style.display = 'none';
            };
        }

        // --- FUNGSI DOWNLOAD KE GALERI ---
        async function downloadImage() {
            try {
                const response = await fetch(currentImgFullUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = `IQC_WINZ_${Date.now()}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (err) {
                alert("Gagal download otomatis. Silakan tekan lama gambarnya lalu pilih 'Simpan Gambar'.");
            }
        }
    </script>
</body>
</html>
